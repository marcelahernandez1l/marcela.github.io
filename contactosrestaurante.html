<form action="index.html" method="get">

    <div class="grid-formulario">

        <div class="campo">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre"
                required>

        </div>

        <div class="campo">

            <label for="correo">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com"
                required>

        </div>

        <div class="campo">

            <label for="telefono">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="+503 7000-0000"
                required>

        </div>

        <div class="campo">

            <label for="asunto">
                Asunto
            </label>

            <select
                id="asunto"
                name="asunto"
                required>

                <option value="">
                    Selecciona un asunto
                </option>

                <option value="reservacion">
                    Reservación
                </option>

                <option value="menu">
                    Consulta sobre menú
                </option>

                <option value="evento">
                    Eventos
                </option>

                <option value="otro">
                    Otro
                </option>

            </select>

        </div>

        <div class="campo campo-completo">

            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                name="mensaje"
                placeholder="Escribe tu mensaje"
                required></textarea>

        </div>

    </div>

    <button
        type="submit"
        class="boton boton-principal boton-formulario">

        Enviar mensaje

    </button>

</form>
